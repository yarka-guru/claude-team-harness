<!DOCTYPE html>
<html lang="en" class="intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title></title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23182029'/%3E%3Ccircle cx='7' cy='9' r='3.5' fill='%236aa8ff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #07080e; --panel: rgba(30, 32, 43, .94); --panel2: rgba(255, 255, 255, .055); --hair: rgba(255, 255, 255, .09); --hair2: rgba(255, 255, 255, .09);
  --ink: #f5f5f7; --ink2: #cfcfd8; --ink3: #b4b4c0;
  --you: #ffb340; --you-2: #ff9500; --you-ink: #1d1203; --ok: #4cd97b; --bad: #ffb4ac; --ok-mark: #30d158; --bad-mark: #ff453a;
  --tick: rgba(235, 235, 245, .42); --tick-live: rgba(255, 255, 255, .9); --span: rgba(255, 255, 255, .06); --lane-alt: rgba(255, 255, 255, .025);
  --a2a-bg: rgba(127, 224, 234, .07); --a2a-line: rgba(127, 224, 234, .45); --a2a-ink: #9fe8f0; --a2a-arc: rgba(127, 224, 234, .75);
  --grid: rgba(255, 255, 255, .07); --grid-hr: rgba(255, 255, 255, .12); --mark-stroke: rgba(20, 22, 30, .9); --link: #8fc3ff;
  --r-panel: 26px; --r-tile: 22px; --r-chip: 999px;
  --panel-bg: linear-gradient(180deg, rgba(38, 40, 52, .80) 0%, rgba(22, 24, 33, .84) 100%);
  --panel-border: rgba(255, 255, 255, .13);
  --panel-shadow: inset 0 1px 0 rgba(255, 255, 255, .20), inset 0 -1px 0 rgba(255, 255, 255, .04), 0 22px 48px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .22);
  --panel-blur: blur(30px) saturate(170%);
  --spring: cubic-bezier(.2, .85, .25, 1.12);
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-num: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fs: 16px; --fs-h: 18px; --fs-big: 32px;
  --surface: var(--panel); --surface-2: rgba(255, 255, 255, .06); --surface-3: rgba(255, 255, 255, .1); --line: var(--hair); --line-2: rgba(255, 255, 255, .16);
  --text: var(--ink); --muted: var(--ink2); --faint: var(--ink3); --accent: var(--link); --warn: var(--you); --crit: var(--bad);
  --on-warn: var(--you-ink); --radius: 12px; --shadow: 0 24px 60px rgba(0, 0, 0, .55);
  --fs-xs: 16px; --fs-sm: 16px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px;
  --r-lead: #ffcf7a; --r-user: #f5f5f7; --r-swe: #8fc3ff; --r-delivery: #ffb27a; --r-sre: #ff9f96;
  --r-research: #7fe0ea; --r-review: #c9b0ff; --r-codex: #7fe3ad; --r-design: #ffa8d8; --r-grey: #cfcfd8; --hash-l: 76%;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 400 var(--fs)/1.45 var(--font-ui); height: 100vh; overflow: hidden;
  display: grid; gap: 12px; padding: 12px 16px 14px;
  grid-template-columns: minmax(0, 1fr) clamp(340px, 28vw, 480px);
  grid-template-rows: auto auto auto minmax(0, 1fr) minmax(190px, 1.3fr);
  grid-template-areas: "top top" "kpis chat" "need chat" "who chat" "board chat";
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
a { color: var(--link); }
code, pre, .mono { font-family: var(--font-mono); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
.panel { background: var(--panel); border: 1px solid var(--hair); border-radius: 6px; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.ph { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px 8px; border-bottom: 1px solid var(--hair2); flex: none; min-width: 0; }

header#top { grid-area: top; display: flex; align-items: center; gap: 22px; white-space: nowrap; min-width: 0; }

header .chip.bad { color: var(--bad); border-color: var(--bad); }
.livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.livedot.off { background: var(--bad); }

#langtoggle button:hover { color: var(--ink); }
#langtoggle button[aria-pressed="true"] { color: #111218; background: var(--ink); }
#ritualstatus .rbtn { display: inline-flex; align-items: center; gap: 7px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--hair); border-radius: var(--r-chip); padding: 1px 12px; background: rgba(255, 255, 255, .05); }
#ritualstatus .rbtn:hover { color: var(--ink); background: rgba(255, 255, 255, .1); }
#ritualstatus .rbtn span { overflow: hidden; text-overflow: ellipsis; }
.rdot { width: 9px; height: 9px; border-radius: 50%; background: var(--you-2); box-shadow: 0 0 8px rgba(255, 149, 0, .7); flex: none; display: inline-block; }
.rgroup { display: flex; align-items: center; gap: 8px; padding: 12px 9px 4px; font-weight: 600; color: var(--ink); }
.rgroup:first-child { padding-top: 4px; }
.rlate { margin-left: auto; color: var(--you); font-weight: 500; white-space: nowrap; }
.rnone { padding: 2px 9px 4px; color: var(--ink2); }
#drawer.wide { width: min(980px, 100vw); }
#drawer.wide #ritualsview { grid-template-columns: 260px minmax(0, 1fr); }
.cmd { display: block; font: 500 16px var(--font-mono); background: rgba(29, 18, 3, .12); border-radius: 8px; padding: 3px 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#needp .scroll { -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent); mask-image: linear-gradient(#000 calc(100% - 26px), transparent); }
header .live b.bad { color: var(--bad); }
.scroll { scrollbar-color: var(--hair) transparent; scrollbar-width: thin; }
#chat .mh .k.ask { color: var(--ink); font-weight: 700; }
#chat li > div[role="button"] { cursor: pointer; }
#chat li > div { padding: 8px 0; }
#who .vd.pass { color: var(--ok); font-weight: 600; } #who .vd.fail { color: var(--bad); font-weight: 600; }
#ritualstatus { display: inline-flex; gap: 4px; overflow: hidden; min-width: 0; }
#ritualstatus button { overflow: hidden; text-overflow: ellipsis; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--hair); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink2); }
.toggle input:checked + .sw { border-color: var(--you); }
.toggle input:checked + .sw::after { left: 15px; background: var(--you); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--link); outline-offset: 2px; }
.toggle.denied { opacity: .55; cursor: not-allowed; }

.kpi .l { font-size: var(--fs); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-family: var(--font-num); font-size: var(--fs-big); font-weight: 600; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: var(--fs); font-weight: 500; color: var(--ink2); }
.kpi.you { border-color: var(--you); }
.kpi.you .v { color: var(--you); }
.kpi .ok { color: var(--ok); } .kpi .bad { color: var(--bad); }
.kpi .dim { color: var(--ink2); }
.kspark { display: flex; align-items: flex-end; gap: 2px; height: 18px; margin-left: 4px; }
.kspark i { width: 5px; background: var(--tick); border-radius: 1px; }

#needp { grid-area: need; }
#needp.on { background: var(--you); color: var(--you-ink); border-color: var(--you); }
#needp.on .ph { border-bottom-color: rgba(26, 20, 5, .25); }
#needp.on .ph span { color: var(--you-ink); }

#needp .cnt.ping { animation: ping 1.4s ease-out 3; border-radius: 6px; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(26, 20, 5, .55); } 80%, 100% { box-shadow: 0 0 0 10px transparent; } }
.ni:hover { background: rgba(26, 20, 5, .07); }
.ni:focus-visible { outline-color: var(--you-ink); outline-offset: -3px; }
.ni.fresh { animation: fresh 1.6s ease-out 2; }
@keyframes fresh { 0% { background: rgba(255, 255, 255, .35); } 100% { background: transparent; } }
.ni .how { font-size: var(--fs); line-height: 1.45; margin-top: 3px; overflow-wrap: anywhere; }
.ni .how b { font-weight: 600; }
.ni .live { font-weight: 700; border: 1.5px solid var(--you-ink); border-radius: 3px; padding: 0 5px; font-size: 16px; margin-left: 4px; white-space: nowrap; }


#whop { grid-area: who; }
#who { list-style: none; padding: 2px 14px; }
#who li { padding: 7px 0; border-bottom: 1px solid var(--hair2); }
#who li:last-child { border-bottom: 0; }
#who li.click { cursor: pointer; }
#who li.click:hover .nm { text-decoration: underline; }
#who .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
#who .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
#who .idle .dot { background: var(--you); }
#who .quiet .dot, #who .done .dot { background: none; border: 1.5px solid var(--ink2); }
#who .ghost .dot { background: none; border: 1.5px solid var(--bad); }
#who .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#who .d { margin-left: auto; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }

#who .tx { color: var(--ink); margin-left: 17px; line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.gotab { flex: none; font-weight: 600; font-size: 16px; padding: 0 12px; line-height: 26px; border-radius: var(--r-chip); white-space: nowrap; }
.gotab:disabled { opacity: .85; cursor: default; }
#who .one .tx { margin: 0 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: block; }
#who .idle .tx { color: var(--you); }
#who .quiet .tx, #who .done .tx { color: var(--ink2); }
#who .ghost .tx { color: var(--bad); }

#boardp { grid-area: board; }
.empty { color: var(--ink2); padding: 14px; }

#chatp { grid-area: chat; }
.filters { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--hair2); flex: none; flex-wrap: wrap; }
.filters button { font: 500 var(--fs) var(--font-ui); color: var(--ink2); border: 1px solid var(--hair); border-radius: 4px; padding: 2px 9px; white-space: nowrap; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.filters button b { font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
#chat { list-style: none; padding: 0 14px; }
#chat li { border-bottom: 1px solid var(--hair2); }
#chat li > button { display: block; width: 100%; padding: 8px 0; }
#chat .mh { color: var(--ink2); display: flex; gap: 6px; min-width: 0; align-items: baseline; }
#chat .mh b { color: var(--ink); font-weight: 600; white-space: nowrap; }
#chat .mh .to { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#chat .mh .k { white-space: nowrap; }
#chat .mh .k.dec { color: var(--ink); }
#chat .mh .k.you { color: var(--you); }
#chat .mh .k.bad, #chat .mh .v.fail { color: var(--bad); }
#chat .mh .v.pass { color: var(--ok); }
#chat .mh .tm { margin-left: auto; font-variant-numeric: tabular-nums; flex: none; }
#chat p { line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
#chat li.open p { display: block; white-space: pre-wrap; }
#chat p code { font-size: 16px; background: var(--panel2); border-radius: 3px; padding: 0 4px; }
#chat li.you { box-shadow: inset 3px 0 0 var(--ink2); margin-left: -14px; padding-left: 11px; }
#chat li.need { box-shadow: inset 3px 0 0 var(--you); margin-left: -14px; padding-left: 11px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: rgba(245, 182, 65, .28); } to { background: transparent; } }

nav#tabs { display: none; }
#ritualshome { display: none; }

#files { position: fixed; z-index: 30; right: 16px; width: min(620px, calc(100vw - 32px)); max-height: min(60vh, 560px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow); }
#fileslist { overflow-y: auto; padding-bottom: 6px; }
.frepo { padding: 8px 14px 2px; color: var(--ink2); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .4px; }
.claim { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 6px 14px; border-top: 1px solid var(--hair2); }
.claim .cp { font-family: var(--font-mono); font-size: 16px; overflow-wrap: anywhere; }
.claim .cm { grid-column: 1; display: flex; gap: 8px; align-items: center; color: var(--ink2); font-size: var(--fs-xs); min-width: 0; flex-wrap: wrap; }
.claim .age { grid-row: 1; grid-column: 2; color: var(--ink2); font-size: var(--fs-xs); }
.claim.multi { background: rgba(245, 182, 65, .09); }
.linkbtn { color: var(--link); white-space: nowrap; }
.linkbtn:hover { text-decoration: underline; }

#scrim { position: fixed; inset: 0; z-index: 40; background: rgba(15, 18, 21, .6); }
#drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: var(--fs); }
.dhead { padding: 14px 18px 12px; border-bottom: 1px solid var(--hair); flex: none; }
.dtop { display: flex; align-items: center; gap: 8px; }
.dtop .id { font-family: var(--font-mono); color: var(--ink2); }
.dclose { margin-left: auto; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--ink2); font-size: 20px; text-align: center; }
.dclose:hover { background: var(--surface-3); color: var(--ink); }
.dtitle { font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; margin: 6px 0 10px; overflow-wrap: anywhere; }
.dmeta { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 4px 12px; }
.dmeta dt { color: var(--ink2); }
.dmeta dd { min-width: 0; overflow-wrap: anywhere; }
.dnote { margin-top: 10px; padding: 7px 10px; border-left: 3px solid var(--line-2); background: var(--panel2); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
.dbody { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 24px; }
.dsec { padding: 12px 18px 4px; color: var(--ink2); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .5px; display: flex; gap: 8px; }
.dagent { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 6px 18px; }
.dagent .res { grid-column: 1 / -1; color: var(--ink2); overflow-wrap: anywhere; }
.dagent .r { color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; min-width: 0; max-width: 100%; color: var(--c); }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.chip { font-size: var(--fs-xs); color: var(--ink2); border: 1px solid var(--hair); border-radius: 4px; padding: 0 5px; line-height: 20px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.sess { font-family: var(--font-mono); font-size: var(--fs-xs); border-radius: 4px; padding: 0 4px; line-height: 18px; white-space: nowrap; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); }
.taskref { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink); background: var(--surface-3); border-radius: 4px; padding: 0 5px; line-height: 20px; white-space: nowrap; }
button.taskref:hover { background: #2f3842; }
.unowned { color: var(--ink2); font-style: italic; }
.spill { font-size: var(--fs-xs); padding: 0 6px; border-radius: 4px; white-space: nowrap; font-weight: 600; line-height: 20px; display: inline-block; color: var(--sc); background: color-mix(in srgb, var(--sc) 16%, transparent); }
.kb { font-size: var(--fs-xs); font-weight: 600; padding: 0 5px; border-radius: 4px; line-height: 20px; white-space: nowrap; align-self: center; color: var(--kc, var(--ink2)); background: color-mix(in srgb, var(--kc, var(--ink2)) 16%, transparent); }
.kb.ask { --kc: var(--link); } .kb.decision, .kb.pass { --kc: var(--ok); } .kb.blocker, .kb.fail { --kc: var(--bad); } .kb.handoff { --kc: var(--r-review); } .kb.report { --kc: var(--r-research); }
.day { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: var(--fs-xs); margin: 12px 18px 4px; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.timeline .msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 7px 18px 3px; }
.timeline .msg.cont { padding-top: 0; }
.timeline .msg.cont .av, .timeline .msg.cont .mh { display: none; }
.timeline .msg.cont .mb { grid-column: 2; }
.av { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: var(--bg); background: var(--c); }
.mb { min-width: 0; }
.timeline .mh { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; position: relative; padding-right: 48px; }
.timeline .mh .tm { position: absolute; right: 0; top: 1px; }
.nm { font-weight: 600; white-space: nowrap; color: var(--c); }
.arrow { color: var(--ink2); }
.tm { color: var(--ink2); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; }
.txt code, .sys code { background: var(--surface-3); border-radius: 4px; padding: 0 4px; font-size: 16px; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
.more { color: var(--link); margin-top: 2px; }
.more:hover { text-decoration: underline; }
.req { margin: 10px 18px 6px; padding: 8px 12px 10px; border-left: 3px solid var(--ink2); background: var(--panel2); border-radius: 0 6px 6px 0; }
.req .rh { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.req .rl { font-weight: 600; }
.req .rh .tm { margin-left: auto; }
.sys { display: flex; align-items: baseline; gap: 7px; padding: 3px 18px 3px 58px; color: var(--ink2); min-width: 0; }
.sys .ic { width: 14px; flex: none; text-align: center; color: var(--ink2); font-size: 16px; margin-left: -21px; }
.sys .sc { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sys .tm { flex: none; margin-left: auto; }
.spawn { margin: 6px 18px 6px 58px; padding: 7px 10px 8px; border: 1px solid var(--hair); border-radius: 6px; }
.spawn .sh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; position: relative; padding-right: 48px; }

  if (n !== lastNarrow) { lastNarrow = n; if (n) { closeDrawer(); $("files").hidden = false; } else { toggleFiles(false); restoreRituals(); } }
  fitKpis();
});
if (!CHAT_FILTERS.includes(S.filter)) S.filter = "all";
function relang(lang) {
  if (lang === LANG) return;
  setLang(lang, true);
  S.sigs = {};
  S.msgs = S.msgs.map(m => chatItem(m.e)).filter(Boolean);
  syncNotifyToggle();
  renderTabs();
  if (S.snap) { renderNeed(S.snap); renderHeader(S.snap); renderKpis(); renderWho(S.snap); renderBoardPanel(S.snap); renderFiles(S.snap); setConn(S.failures <= 1, S.snap); }
  renderChat();
  renderRitualList();
  S.ritualDoc = null;
  if (S.view === "rituals" || (S.drawer && S.drawer.rituals)) loadRitualDoc();
  if (S.drawer && S.drawer.id) loadDrawer(true);
}
for (const b of document.querySelectorAll("#langtoggle button")) b.addEventListener("click", () => relang(b.dataset.lang));
if (narrow()) $("files").hidden = false;
setView(S.view);
tick();
tickOps();
setInterval(tick, 1500);
setInterval(tickOps, 5000);
setInterval(() => { refreshTimes(); if (S.snap) renderHeader(S.snap); }, 15000);
setTimeout(() => document.documentElement.classList.remove("intro"), 1500);
</script>
